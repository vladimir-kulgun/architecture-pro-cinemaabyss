{{- if .Values.eventsConsumer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-consumer
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-consumer
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.eventsConsumer.replicas }}
  selector:
    matchLabels:
      app: events-consumer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: events-consumer
    spec:
      containers:
      - name: events-consumer
        image:  {{ .Values.eventsConsumer.image.repository }}:{{ .Values.eventsConsumer.image.tag }}
        imagePullPolicy: {{ .Values.eventsConsumer.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.eventsConsumer.service.targetPort }}
        env:
        - name: PORT
          value: {{ .Values.eventsConsumer.service.targetPort | quote }}
        - name: ASPNETCORE_URLS
          value: http://+:{{ .Values.eventsConsumer.service.targetPort }}
        - name: KAFKA_BROKERS
          value: kafka:9092
        envFrom:
        - configMapRef:
            name: cinemaabyss-config
        - secretRef:
            name: cinemaabyss-secrets
        resources:
          {{- toYaml .Values.eventsConsumer.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /health/ready
            port: {{ .Values.eventsConsumer.service.targetPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: {{ .Values.eventsConsumer.service.targetPort }}
          initialDelaySeconds: 15
          periodSeconds: 20
      restartPolicy: Always
      imagePullSecrets:
        - name: dockerconfigjson
---
apiVersion: v1
kind: Service
metadata:
  name: events-consumer
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-consumer
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: events-consumer
  ports:
  - port: {{ .Values.eventsConsumer.service.port }}
    targetPort: {{ .Values.eventsConsumer.service.targetPort }}
  type: {{ .Values.eventsConsumer.service.type }}
{{- end }}